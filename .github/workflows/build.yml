name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project CashBook.xcodeproj \
            -target CashBook \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/CashBook.app

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CashBook.app Payload/
          zip -qry CashBook.ipa Payload
          ls -lh CashBook.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: CashBook-ipa
          path: CashBook.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
